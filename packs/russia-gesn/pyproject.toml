[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openconstructionerp-russia-gesn"
version = "0.1.0"
description = "Country pack for the Russian market: the GESN/FER norm base and its four-part code, the resource-index method with its labour, plant and material decomposition, overhead and profit taken on payroll, the twelve-chapter summary estimate, price level and conversion indices, rouble at two decimals."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "Construction AI OS", email = "support@example.com" },
]
keywords = [
    "openconstructionerp",
    "ocerp",
    "country-pack",
    "russia",
    "gesn",
    "fer",
    "fsnb",
    "smeta",
    "resource-index-method",
    "rouble",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Other Audience",
    "Topic :: Office/Business",
    "Natural Language :: Russian",
    "Natural Language :: English",
]
dependencies = [
    "openconstructionerp>=5.5.0",
]

[project.urls]
Source = "https://github.com/abdelnabym519-cpu/Construction-AI-OS"

[project.entry-points."openconstructionerp.partner_packs"]
russia-gesn = "openconstructionerp_russia_gesn:MANIFEST"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openconstructionerp_russia_gesn = [
    "onboarding.yaml",
    "rule_packs/*.json",
]
